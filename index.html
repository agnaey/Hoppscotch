<script>
    const resizer = document.querySelector(".resizer");
const leftPanel = document.querySelector(".left-panel");
const rightPanel = document.querySelector(".right-panel");

let isResizing = false;

resizer.addEventListener("mousedown", (event) => {
    isResizing = true;
    document.addEventListener("mousemove", handleResize);
    document.addEventListener("mouseup", () => {
        isResizing = false;
        document.removeEventListener("mousemove", handleResize);
    });
});

function handleResize(event) {
    if (!isResizing) return;

    let newLeftWidth = event.clientX / window.innerWidth * 100;
    if (newLeftWidth > 20 && newLeftWidth < 80) {
        leftPanel.style.width = `${newLeftWidth}%`;
        rightPanel.style.width = `${100 - newLeftWidth}%`;
    }
}

</script>

<script>
    // Function to create a new tab
document.getElementById("add-tab").addEventListener("click", function () {
    const tabContainer = document.getElementById("tab-container");
    const tabContent = document.getElementById("tab-content");

    // Count existing tabs
    let tabCount = document.querySelectorAll(".tab").length;

    // Create new tab
    const newTab = document.createElement("div");
    newTab.classList.add("tab");
    newTab.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="request-method text-success">GET</div>
            <div class="request-title">Untitled </div>
            <div class="close-tab">&times;</div>
        </div>
    `;

    // Create new content for the tab
    const newContent = document.createElement("div");
    newContent.classList.add("content-panel");
    newContent.innerHTML = `This is content for Tab ${tabCount}`;

    // Append new tab and content
    tabContainer.insertBefore(newTab, document.getElementById("add-tab"));
    tabContent.appendChild(newContent);

    // Activate new tab
    activateTab(newTab, newContent);

    // Close tab functionality
    newTab.querySelector(".close-tab").addEventListener("click", function () {
        newTab.remove();
        newContent.remove();

        // If no tabs remain, restore the default "Untitled" tab
        if (document.querySelectorAll(".tab").length === 0) {
            createDefaultTab();
        }
    });

    // Click to switch tabs
    newTab.addEventListener("click", function () {
        activateTab(newTab, newContent);
    });
});

// Function to activate a tab
function activateTab(tab, content) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".content-panel").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    content.classList.add("active");
}

// Function to create the default "Untitled" tab
function createDefaultTab() {
    const tabContainer = document.getElementById("tab-container");
    const tabContent = document.getElementById("tab-content");

    // **Remove any existing tabs before creating a new default one**
    document.querySelectorAll(".tab").forEach(tab => tab.remove());
    document.querySelectorAll(".content-panel").forEach(content => content.remove());

    // Create the default tab
    const defaultTab = document.createElement("div");
    defaultTab.classList.add("tab", "active");
    defaultTab.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="request-method text-success">GET</div> 
            <div class="request-title">Untitled</div> 
        </div>
    `;

    // Create default content
    const defaultContent = document.createElement("div");
    defaultContent.classList.add("content-panel", "active");
    defaultContent.innerHTML = "This is the default Untitled content.";

    // Insert default tab before the + button
    tabContainer.insertBefore(defaultTab, document.getElementById("add-tab"));
    tabContent.appendChild(defaultContent);

    // Clicking it activates it
    defaultTab.addEventListener("click", function () {
        activateTab(defaultTab, defaultContent);
    });
}

// Ensure a default tab is created when the page loads
createDefaultTab();
</script>


<script>
    document.getElementById("method-selector").addEventListener("click", function () {
        const options = document.getElementById("method-options");
        options.style.display = options.style.display === "block" ? "none" : "block";
    });

    function changeMethod(method) {
        document.getElementById("selected-method").innerText = method;
        document.getElementById("method-options").style.display = "none";
    }

    // Close dropdown when clicking outside
    document.addEventListener("click", function (event) {
        if (!document.getElementById("method-selector").contains(event.target)) {
            document.getElementById("method-options").style.display = "none";
        }
    });
</script>
